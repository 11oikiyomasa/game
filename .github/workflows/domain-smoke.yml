name: Domain Smoke Test

on:
  push:
    paths:
      - 'Assets/Scripts/Game.Domain/**'
      - 'Tools/DomainSmokeTest/**'
      - '.github/workflows/domain-smoke.yml'
  pull_request:
    paths:
      - 'Assets/Scripts/Game.Domain/**'
      - 'Tools/DomainSmokeTest/**'
      - '.github/workflows/domain-smoke.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and run domain smoke test
        run: dotnet run --project Tools/DomainSmokeTest/DomainSmokeTest.csproj --configuration Release
